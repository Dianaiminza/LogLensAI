
services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Intentionally do not publish port 11434 to the internet.

  web:
    build:
      context: ./LogLensAI.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      Ollama__BaseUrl: http://ollama:11434/
      Ollama__Model: llama3.2:3b
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - ollama

volumes:
  ollama_data: